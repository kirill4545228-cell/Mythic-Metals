name: Build Mod from ZIP

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find project ZIP
        id: findzip
        run: |
          # Look for any .zip in the repo root
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "No .zip file found in repo root!"
            exit 1
          fi
          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Unzip project
        run: |
          ZIP="${{ steps.findzip.outputs.zip }}"
          # Unzip into a temp dir to detect structure
          mkdir -p /tmp/unzipped
          unzip -q -o "$ZIP" -d /tmp/unzipped
          # Check if contents are nested under a single folder
          SUBDIR=$(find /tmp/unzipped -maxdepth 1 -type d ! -path /tmp/unzipped | head -1)
          if [ -n "$SUBDIR" ] && [ "$(find /tmp/unzipped -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
            echo "Nested folder detected: $SUBDIR"
            cp -a "$SUBDIR"/. .
          else
            echo "Flat structure"
            cp -a /tmp/unzipped/. .
          fi
          echo "--- Files after unzip ---"
          ls -la

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mythic-metals-addon-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload full project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mythic-metals-addon-full
          path: |
            build/libs/*.jar
            src/
            build.gradle
            settings.gradle
            gradle.properties
            README.md
